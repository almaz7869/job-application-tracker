name: Build Spring Boot API
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-build.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Extract backend source
        run: unzip -oq backend/job-tracker-backend-source.zip -d backend
      - run: mvn -B -DskipTests package
        working-directory: backend

