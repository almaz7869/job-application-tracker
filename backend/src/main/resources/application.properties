spring.application.name=job-application-tracker
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/job_application_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:localdev}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.ai.openai.api-key=${AI_API_KEY:local-placeholder}
spring.ai.openai.chat.model=${AI_MODEL:gpt-5-mini}
app.jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-before-deploying}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
springdoc.swagger-ui.path=/swagger-ui.html
app.auth.username=${APP_USERNAME:}
app.auth.password=${APP_PASSWORD:}
